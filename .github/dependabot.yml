# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      release-tools:
        patterns:
          - "@commitlint/*"
          - "semantic-release"
          - "@semantic-release/*"
      build-tools:
        patterns:
          - "@types/*"
          - "@tsconfig/*"
          - "ts-node"
          - "typescript"
        exclude-patterns:
          - "@types/chai"
          - "@types/mocha"
          - "@types/sinon"
          - "@types/sinon-chai"
      lint-tools:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      test-tools:
        patterns:
          - "chai"
          - "@types/chai"
          - "@istanbuljs/nyc-config-typescript"
          - "nyc"
          - "mocha"
          - "@types/mocha"
          - "sinon"
          - "@types/sinon"
          - "sinon-chai"
          - "@types/sinon-chai"
          - "mockdate"
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by
      # @typescript-eslint, which peers typescript ">=4.8.4 <6.1.0". Bumping the
      # major makes `npm ci` fail with ERESOLVE, breaking the lint jobs. Hold the
      # major until the lint toolchain supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node is deliberately pinned to the oldest Node.js version this
      # package supports (see the 16.x entry in the CI test matrix, and
      # @tsconfig/node16). Taking a major would type-check the source against a
      # newer runtime's APIs while CI still claims Node 16 support, so the major
      # is only moved when the support floor is raised.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions" # Keep workflow action versions up to date
    directory: "/"
    schedule:
      interval: "weekly"

